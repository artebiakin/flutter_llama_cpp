# Run with `dart run ffigen --config ffigen.yaml`.
name: LlamaFlutterBindings
description: |
  Bindings for `native/shim/llama_flutter.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/llama_flutter_bindings_generated.dart'
headers:
  entry-points:
    - 'native/shim/llama_flutter.h'
  include-directives:
    - 'native/shim/llama_flutter.h'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
functions:
  include:
    - 'lf_.*'  # Include all functions starting with lf_
structs:
  include:
    - 'lf_.*'  # Include all structs starting with lf_
enums:
  include:
    - 'lf_.*'  # Include all enums starting with lf_
typedefs:
  include:
    - 'lf_.*'  # Include all typedefs starting with lf_
comments:
  style: any
  length: full
